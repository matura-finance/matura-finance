name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy, non-secret values so `prisma generate` and the API bootstrap resolve
    # env at build/test time. No real database is contacted (health check only).
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://localhost:5432/matura?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: generates the Prisma client and each app's next-env.d.ts,
      # which lint and typecheck depend on.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: E2E test
        run: pnpm test:e2e

      - name: Contracts compile
        run: pnpm contracts:compile

      - name: Contracts test
        run: pnpm contracts:test

      - name: Contracts ABI export is fresh
        run: |
          pnpm --filter @matura/contracts contracts:export-abis
          git diff --exit-code packages/chain/src/abis

      - name: Deployment manifest loader is fresh
        run: |
          pnpm --filter @matura/chain gen:deployments
          git diff --exit-code packages/chain/src/deployments.generated.ts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the open-source gitleaks Docker image directly. The gitleaks-action
      # wrapper requires a paid license for organization repos; the CLI does not.
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest \
            dir /repo -c /repo/.gitleaks.toml --redact --no-banner --exit-code 1
